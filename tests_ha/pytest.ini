; Configuration for the Home Assistant test suite in this directory.
;
; These tests run against a real Home Assistant through pytest-homeassistant,
; the testing package Home Assistant itself publishes, pinned to the Home
; Assistant version in pyproject.toml's `test` group. A pytest.ini here gives
; this directory its own rootdir, so the plugin's fixtures apply to this suite
; and to this suite only:
;     pytest tests_ha/
;
; `-p no:respx` is what the plugin's own documentation asks for: Home Assistant
; installs its httpx alias on import, and the respx pytest plugin imports httpx
; first, which makes the alias raise.
;
; Running both suites in one pytest process is not supported: the stubbed
; modules in tests/ replace the homeassistant package at import time.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:respx
