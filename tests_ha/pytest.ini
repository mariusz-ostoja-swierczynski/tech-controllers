; Configuration for the Home Assistant test suite in this directory.
;
; These tests run against a real Home Assistant through
; pytest-homeassistant-custom-component, which the repository's root pytest.ini
; keeps out of the stubbed suite in tests/. A pytest.ini here gives this
; directory its own rootdir, so the plugin loads for this suite and for this
; suite only:
;     pytest tests_ha/
;
; Running both suites in one pytest process is not supported: the stubbed
; modules in tests/ replace the homeassistant package at import time.
[pytest]
asyncio_mode = auto
