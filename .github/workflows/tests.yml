name: Run tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      TZ: "Europe/Berlin"
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e .
          pip install --group test_api
      - name: Run tests
        uses: pavelzw/pytest-action@v2
        with:
          emoji: true
          verbose: true
          job-summary: true
          custom-arguments: "tests/ --cov-report=term-missing --cov=custom_components.tech.tech"
          click-to-expand: true
          report-title: "Tech API test report"

  home-assistant:
    name: Run Home Assistant tests
    runs-on: ubuntu-latest
    env:
      TZ: "Europe/Berlin"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install requirements
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e .
          # pytest-homeassistant-custom-component lives in the `test` group.
          pip install --group test
      - name: Run tests
        run: pytest tests_ha/ --cov-report=term-missing --cov=custom_components.tech.config_flow
