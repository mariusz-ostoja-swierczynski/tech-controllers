name: Run tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      TZ: "Europe/Berlin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install requirements
        run: |
          python -m pip install --upgrade "pip>=25.1"
          pip install -e .
          # The API tests need the `test_api` group; the Home Assistant suite
          # needs `test`, which pins the Home Assistant version it runs on.
          pip install --group test_api --group test
      - name: Typecheck the integration
        # Strict typing is a Platinum requirement of the integration quality
        # scale. `mypy` with no arguments checks exactly the component, from
        # [tool.mypy] in pyproject.toml.
        run: mypy
      - name: Run the API and integration tests
        uses: pavelzw/pytest-action@v2
        with:
          emoji: true
          verbose: true
          job-summary: true
          # No report here: the Home Assistant suite appends its own data to
          # this run and prints the combined table below.
          custom-arguments: "tests/ --cov=custom_components.tech --cov-report="
          click-to-expand: true
          report-title: "Tech API test report"
      - name: Run the Home Assistant tests
        # The two suites are separate pytest processes (this one has a real
        # Home Assistant, the one above stubs it), so their coverage is
        # combined with --cov-append. The floor is on the combined total, and
        # the table it prints is where each module is read.
        run: >
          pytest tests_ha/ --cov=custom_components.tech --cov-append
          --cov-report=term-missing --cov-report=json --cov-fail-under=95
      - name: Check every module's coverage
        # The test-coverage rule asks for 95% per module as well as in total, and
        # coverage's own fail_under only covers the total.
        run: python script/check_module_coverage.py
