[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-controllers"
version = "1.0.0"
description = "Home Assistant integration for TECH Sterowniki heating controllers"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Mariusz Ostaja-Swierczynski", email = "mariusz.ostaja.swierczynski@gmail.com" },
  { name = "anarion80", email = "anarion80@users.noreply.github.com" },
]
maintainers = [
  { name = "anarion80", email = "anarion80@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.14.2"
dependencies = [
  "aiodns==4.0.4",
  "aiogithubapi==26.0.0",
  "aiohttp==3.14.4",
  "aiohttp_cors==0.8.1",
  "aiohttp-fast-zlib==0.3.0",
  "aiohttp-asyncmdnsresolver==0.2.0",
  "aiozoneinfo==0.2.3",
  "annotatedyaml==1.0.2",
  "astral==2.2",
  "async-interrupt==1.2.2",
  "attrs==26.1.0",
  "atomicwrites-homeassistant==1.4.1",
  "audioop-lts==0.2.2",
  "awesomeversion==25.8.0",
  "bcrypt==5.0.0",
  "certifi==2026.4.22",
  "ciso8601==2.3.3",
  "cronsim==2.7",
  "fnv-hash-fast==2.0.3",
  "gazetteer-matcher==1.1.0",
  "ha-ffmpeg==3.2.2",
  # hass-nabucasa is imported by helpers which don't depend on the cloud
  # integration
  "hass-nabucasa==2.7.0",
  "hassil==3.12.1",
  # When bumping httpx, please check the version pins of
  # httpcore, anyio, and h11 in gen_requirements_all
  "httpx==0.28.1",
  "home-assistant-bluetooth==2.0.0",
  "home-assistant-frontend==20260930.2",
  "home-assistant-intents==2026.10.6",
  "homeassistant==2026.10.0",
  "ifaddr==0.2.0",
  "infrared-protocols==10.1.0",
  "Jinja2==3.1.6",
  "lru-dict==1.4.1",
  "mutagen==1.48.1",
  "PyJWT==2.15.1",
  # PyJWT has loose dependency. We want the latest one.
  "cryptography==50.0.1",
  "Pillow==12.3.0",
  "probatio==0.13.0",
  "propcache==0.5.4",
  "pyOpenSSL==26.4.0",
  "orjson==3.11.9",
  "packaging==26.2",
  "psutil-home-assistant==0.0.1",
  "python-slugify==9.1.2",
  "pymicro-vad==1.0.1",
  "pyspeex-noise==1.0.2",
  "PyTurboJPEG==1.8.3",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "rf-protocols==4.3.0",
  "securetar==2026.4.1",
  "SQLAlchemy==2.0.54",
  "standard-aifc==3.13.0",
  "standard-telnetlib==3.13.0",
  "typing-extensions==4.16.0",
  "ulid-transform==2.2.9",
  "urllib3==2.6.3",
  "uv==0.12.23",
  "voluptuous==0.15.2",
  "voluptuous-serialize==2.7.0",
  "voluptuous-openapi==0.2.0",
  "yarl==1.25.1",
  "webrtc-models==0.3.0",
  "zeroconf==0.151.5",
  # Integration requirements for the components this dev config loads
  # (default_config plus cast), pinned to the versions Home Assistant
  # 2026.10.0's integration manifests declare. `uv sync` prunes anything not
  # listed here, and the pruned component then fails to import on the next
  # Home Assistant start, so these have to be explicit.
  "aiodhcpwatcher==1.2.7",
  "aiodiscover==3.3.2",
  "aiohasupervisor==0.6.0",
  "aiousbwatcher==1.1.2",
  "async-upnp-client==0.48.2",
  "av==19.0.0",
  "bleak==3.0.2",
  "bleak-retry-connector==4.7.1",
  "bluetooth-adapters==2.4.0",
  "bluetooth-auto-recovery==1.6.4",
  "bluetooth-data-tools==1.29.24",
  "cached-ipaddress==1.1.2",
  "dbus-fast==5.0.22",
  "file-read-backwards==2.0.0",
  "go2rtc-client==0.4.0",
  "habluetooth==7.1.2",
  "numpy==2.3.2",
  "openai==3.10.0",
  "PyChromecast==14.0.10",
  "PyNaCl==1.6.2",
  "serialx==1.11.0",
]

[dependency-groups]
test_api = [
  "astroid==4.0.4",
  "coverage==7.16.2",
  "freezegun==1.5.5",
  "librt==0.9.0",                                   # internal mypy dependency
  "license-expression==30.4.4",
  "mock-open==1.4.0",
  "mypy-dev==2.0.0a1",
  "prek==0.3.11",
  "pydantic==2.13.5",
  "pylint==4.0.5",
  "pylint-per-file-ignores==1.4.0",
  "pipdeptree==4.2.5",
  "pytest-asyncio==1.4.0",
  "pytest-aiohttp==1.1.1",
  "pytest-cov==7.1.0",
  "pytest-freezer==0.4.9",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pytest-socket==0.8.1",
  "pytest-sugar==1.1.1",
  "pytest-timeout==2.4.0",
  "pytest-unordered==0.8.0",
  "pytest-picked==0.5.1",
  "pytest-xdist==3.8.0",
  "pytest==9.0.3",
  "pytest-md==0.2.0",
  "pytest-emoji==0.2.0",
  "requests-mock==1.12.1",
  "respx==0.23.1",
  "syrupy==6.1.1",
  "tqdm==4.70.1",
]

test = [
  "astroid==4.0.4",
  "coverage==7.16.2",
  "freezegun==1.5.5",
  "librt==0.9.0",                                    # internal mypy dependency
  "license-expression==30.4.4",
  "mock-open==1.4.0",
  "mypy-dev==2.0.0a1",
  "prek==0.3.11",
  "pydantic==2.13.5",
  "pylint==4.0.5",
  "pylint-per-file-ignores==1.4.0",
  "pipdeptree==4.2.5",
  "pytest-asyncio==1.4.0",
  "pytest-aiohttp==1.1.1",
  "pytest-cov==7.1.0",
  "pytest-freezer==0.4.9",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pytest-socket==0.8.1",
  "pytest-sugar==1.1.1",
  "pytest-timeout==2.4.0",
  "pytest-unordered==0.8.0",
  "pytest-picked==0.5.1",
  "pytest-xdist==3.8.0",
  "pytest==9.0.3",
  "pytest-md==0.2.0",
  "pytest-emoji==0.2.0",
  "requests-mock==1.12.1",
  "respx==0.23.1",
  "syrupy==6.1.1",
  "tqdm==4.70.1",
  "pytest-homeassistant-custom-component==0.13.371",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[project.urls]
Homepage = "https://github.com/mariusz-ostoja-swierczynski/tech-controllers"
Repository = "https://github.com/mariusz-ostoja-swierczynski/tech-controllers.git"
Issues = "https://github.com/mariusz-ostoja-swierczynski/tech-controllers/issues"
Changelog = "https://github.com/mariusz-ostoja-swierczynski/tech-controllers/releases"
