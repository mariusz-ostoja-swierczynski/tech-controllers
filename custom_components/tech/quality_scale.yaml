# Integration quality scale declaration.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/rules/
#
# This is a custom component distributed through HACS, so nothing validates or
# displays this file: hassfest skips the quality scale for anything that is not
# built into Home Assistant, HACS does not read it, and the frontend only shows
# the tier badge for built-in integrations. It is kept as the project's own
# record of the rules it meets and of the ones it cannot meet.
#
# Bronze and Silver are tracked. The rules of the tiers above them are not
# listed until work on them starts, and the manifest announces the highest tier
# whose rules are all met: a `todo` anywhere under it would make that claim
# untrue.
rules:
  action_setup:
    status: exempt
    comment: The integration registers no service actions.
  appropriate_polling:
    status: done
    comment: >-
      One DataUpdateCoordinator per controller polling the cloud API every 60
      seconds (const.SCAN_INTERVAL), which is inside the interval the API and
      its rate limiting allow.
  brands:
    status: done
    comment: >-
      The eight images (icon, logo and their dark and @2x versions) are in the
      brands repository under custom_integrations/tech/, added by
      https://github.com/home-assistant/brands/pull/5278 and served for this
      domain. A local custom_components/tech/brand/ directory would take
      precedence over them and feed the Marketplace listing before install, but
      it is not needed for this rule.
  common_modules:
    status: done
    comment: >-
      The coordinator lives in coordinator.py and the shared base entities in
      entity.py; every platform derives from them.
  config_flow:
    status: done
    comment: >-
      Two steps with selectors and data_description: the credentials are
      validated before anything is stored, one entry per flow run is created
      through async_create_entry, and the hub-name preference is asked with the
      controller and stored in the entry's options, where the options flow can
      change it later.
  config_flow_test_coverage:
    status: done
    comment: >-
      tests_ha/test_config_flow.py covers config_flow.py completely -- both
      steps, every error branch, both aborts, the options flow and the version 3
      migration.
  dependency_transparency:
    status: exempt
    comment: The manifest declares no external requirements; the API client is part of this repository.
  docs_actions:
    status: exempt
    comment: The integration registers no service actions.
  docs_conditions:
    status: exempt
    comment: The integration registers no conditions.
  docs_high_level_description:
    status: done
    comment: The README opens with what the integration integrates and links the eModul API and services.
  docs_installation_instructions:
    status: done
    comment: README installation covers HACS and manual installation, step by step and with screenshots.
  docs_removal_instructions:
    status: done
    comment: >-
      The README has a removal section: delete the controller entries in the UI,
      remove the integration through HACS or by deleting its directory, restart.
  docs_triggers:
    status: exempt
    comment: The integration registers no triggers.
  entity_event_setup:
    status: exempt
    comment: >-
      No entity subscribes to events; every entity is a CoordinatorEntity and
      updates through its coordinator.
  entity_unique_id:
    status: done
    comment: Every entity derives its unique id from the controller UDID and the tile, zone or menu item.
  has_entity_name:
    status: done
    comment: The base entities and every platform entity set _attr_has_entity_name = True.
  runtime_data:
    status: done
    comment: The coordinator is the config entry's runtime_data; every platform reads it from there.
  test_before_configure:
    status: done
    comment: The flow authenticates against the API and lists the modules before it stores anything.
  test_before_setup:
    status: done
    comment: >-
      async_config_entry_first_refresh raises ConfigEntryNotReady when the
      controller cannot be reached and ConfigEntryAuthFailed when the token is
      no longer valid.
  unique_config_entry:
    status: done
    comment: The flow sets the controller UDID as unique id and aborts when that controller is already configured.

  # ---------------------------------------------------------------------------
  # Silver
  # ---------------------------------------------------------------------------
  action_exceptions:
    status: exempt
    comment: The integration registers no service actions to raise from.
  config_entry_unloading:
    status: done
    comment: >-
      async_unload_entry unloads every platform. The coordinator picks the
      config entry up from the setup context, so Home Assistant registers its
      shutdown on the entry and stops its 60-second timer on unload; a reload
      does not leave a second poller behind.
      tests_ha/test_setup_with_a_controller.py unloads an entry, fires a poll
      interval past it and asserts nothing was fetched.
  docs_configuration_parameters:
    status: done
    comment: >-
      The README's Configuration section describes the entry's one option: what
      including the hub name does to a zone's entity names, when it is worth
      enabling, and that changing it reloads the entry.
  docs_installation_parameters:
    status: done
    comment: >-
      The README's Parameters section lists what the setup form asks for: the
      account name, its password, the controller to add and the naming
      preference.
  entity_unavailable:
    status: done
    comment: >-
      Every entity is a CoordinatorEntity, so all of them report unavailable
      while a poll is failing and available again once it succeeds, instead of
      serving stale values. The entities the controller can withdraw -- the
      dialogue buttons -- combine that with the menu item's access flag in an
      available property.
  integration_owner:
    status: done
    comment: The manifest names two code owners, who are the integration's owners.
  log_when_unavailable:
    status: done
    comment: >-
      The coordinator raises UpdateFailed and adds no logging of its own: Home
      Assistant's coordinator logs the failure once when the controller stops
      answering and the recovery once when it answers again. tests_ha asserts
      exactly one line of each over three failed polls.
  parallel_updates:
    status: done
    comment: >-
      PARALLEL_UPDATES is 1 where entities write to the controller (button,
      climate, number, select, switch), because the API serialises menu and zone
      writes, and 0 where entities only read (binary_sensor, sensor).
  reauthentication_flow:
    status: done
    comment: >-
      async_step_reauth asks for the account's credentials again, keeps the
      controller, stores the refreshed user id and token and reloads the entry;
      credentials of another account abort with their own reason. The
      coordinator raises ConfigEntryAuthFailed for a rejected login and for a
      401 on a data request, which is what starts the flow in the UI.
  test_coverage:
    status: done
    comment: >-
      The two suites together cover 98% of custom_components.tech, and every
      module is at or above 95% -- sensor.py 96%, __init__.py, assets.py,
      coordinator.py and select.py 97%, climate.py and tech.py 98%, the rest 99
      to 100%, as the term-missing table shows. CI and the devenv scripts run
      both suites over the whole package with --cov-fail-under=95 for the total,
      and then script/check_module_coverage.py reads the JSON report and fails on
      any module under the floor, so the per-module half of this rule is gated
      rather than read by eye.

  # ---------------------------------------------------------------------------
  # Gold
  # ---------------------------------------------------------------------------
  # The rules marked `todo` here are the Gold work list: the manifest may only
  # announce this tier once none of them is left. A rule moves to `done` with
  # the code, the tests and the docs behind it, the way the tiers below did.
  devices:
    status: done
    comment: >-
      Every entity carries device_info: the controller device with its
      identifiers, name, model, manufacturer and sw_version, a device per zone
      for the zone-attached entities, and one per wireless sensor or tile that
      owns sub-entities. The zone and sensor devices name the controller as
      their parent by device id (via_device_id), and the controller's device is
      created while the entry sets up so that there is one to name.
  diagnostics:
    status: done
    comment: >-
      diagnostics.py implements async_get_config_entry_diagnostics: the entry's
      data with the token, the account id and any credentials redacted, its
      options, and a summary of what the controller last reported.
      tests_ha/test_diagnostics.py pins those counts against a recorded
      controller and asserts that the token value can never appear in a dump.
  discovery:
    status: exempt
    comment: >-
      The controllers are reached through the eModul cloud and expose no local
      interface -- no DHCP, mDNS, SSDP, USB or Bluetooth surface to discover
      them on. The account's controllers come back from the API as soon as the
      user has entered their credentials.
  discovery_update_info:
    status: exempt
    comment: >-
      Nothing is discovered and no address is stored, so there is no discovery
      information to update network data from.
  docs_data_update:
    status: done
    comment: >-
      The README's "How the data updates" section says that the integration polls
      the eModul service every 60 seconds per controller, that eModul offers no
      push, what a failed poll does to the entities, why a write is shown
      optimistically, and when an entry the controller stops reporting is
      removed.
  docs_examples:
    status: done
    comment: >-
      The README's Examples section carries two automations: a night setback for
      a controller's zones, and a notification when a wireless sensor's battery
      runs low.
  docs_known_limitations:
    status: done
    comment: >-
      The README's Known limitations section lists the cloud dependency, the
      60-second polling, one account per entry, the names and icons that come
      from eModul's own data, menu items appearing only after their entry
      reloads, and that history is not backfilled.
  docs_supported_devices:
    status: done
    comment: >-
      The README lists the controllers reported as working, with a note that
      the list reflects user reports rather than the vendor's own.
  docs_supported_functions:
    status: done
    comment: >-
      The README describes what the integration provides, bullet by bullet, and
      the platforms it sets up with what each is for.
  docs_troubleshooting:
    status: done
    comment: >-
      The README's Troubleshooting section covers unavailable entities, the
      "Authentication expired" state and what to do about it, the retrying state
      after the API could not be reached, a controller that is missing from the
      list, and where to download an entry's diagnostics.
  docs_use_cases:
    status: done
    comment: >-
      The README's Use cases section shows heating with the zone thermostats,
      watching the boiler through the tiles eModul reports, and reacting to
      alarms.
  dynamic_devices:
    status: done
    comment: >-
      The platforms that own devices -- sensor, binary_sensor and climate --
      rebuild their entities from the coordinator's payload on every poll and
      register what is not registered yet (entity.add_later), so a tile or a
      zone the controller starts reporting appears as a device with its
      entities. Menu items are rebuilt when their platform next sets up, which
      is where they belong: they live on devices that already exist.
  entity_category:
    status: done
    comment: >-
      The entities that write to a menu are CONFIG (button, number, select,
      switch) and the diagnostic readings are DIAGNOSTIC (the zone and tile
      battery, signal strength, window and zone-state sensors).
  entity_device_class:
    status: done
    comment: >-
      The sensors and binary sensors carry their classes -- temperature,
      humidity, battery, window, problem, power factor -- and the tile readings
      take the class the widget metadata names. The menu numbers carry no unit
      in the API payload, only a format and a range, so no class is possible for
      them.
  entity_disabled_by_default:
    status: done
    comment: >-
      Menu items deeper than the registration limit are disabled by default
      (button, number, select, switch), and the tile readings carry the widget
      metadata's own enabled_default, so a reading the API marks as secondary
      stays out of the way until it is wanted.
  entity_translations:
    status: done
    comment: >-
      The entities the integration names itself have translation keys with
      placeholders (actuator, window, zone state, temperature, battery, signal
      strength). Everything else is named from the controller's own text ids
      through the eModul translation catalog, which the controller translates
      itself -- the integration fetches it per language.
  exception_translations:
    status: done
    comment: >-
      The messages this integration shows are translation keys: the expired
      token and the unreachable API both carry translation_domain and a key
      (exceptions.token_rejected, exceptions.cannot_connect) with the sentence
      kept as the fallback and as the detail in the log, in every translation
      file. The flow uses the core keys for its own errors, and Home Assistant
      carries a key onto the ConfigEntryNotReady it wraps a failed first poll
      in, so the entry reads in the user's language.
  icon_translations:
    status: done
    comment: >-
      icons.json names the icons this integration chooses for the entities it
      also keys itself -- the zone actuator's valve, which used to be set in
      code. What else sets an icon does so for a reason a file cannot express:
      the entity carries a device class and Home Assistant derives the icon from
      it, the icon depends on the entity's state (the signal-strength readings),
      or the controller itself sends the icon for a tile. A test keeps the file
      and the keys in step, and the two dead static signal icons it replaced are
      gone.
  reconfiguration_flow:
    status: done
    comment: >-
      async_step_reconfigure asks which of the account's controllers the entry
      should stand for, reading the account with the entry's own token, and
      leaves the entry's id alone while its unique id moves with the controller.
      Credentials stay in reauthentication and the naming preference in the
      options flow, so the flow asks one question. A controller another entry
      already holds aborts, and an account that cannot be read keeps the form
      usable with the reason on it.
  repair_issues:
    status: done
    comment: >-
      The one situation the user has to act on -- a flag sensor that the API no
      longer reports and that has a replacement entity -- raises a repair issue
      with translated text pointing at the replacement.
  stale_devices:
    status: done
    comment: >-
      An entity whose payload entry the controller stops reporting is removed,
      and its device with it once nothing is left on it, after that entry has
      been missing for an hour of polls (REMOVAL_MISSES). What counts as
      reported is what the controller sent, not what the entities are built
      from: a tile the controller marks invisible in the eModul app and a zone
      that is unregistered are both still reported, since both are reversible
      and neither means the equipment has gone. The removal takes the entity out
      of Home Assistant as well as the registry, and keeps what the user made of
      it -- the entity id automations point at, its name, its icon, its area --
      so an entry the controller reports again is restored as the same entity
      rather than a new one named after the payload.
      async_remove_config_entry_device is implemented as well, so a device can be
      deleted by hand; only the controller's own device refuses, because
      removing it would be undone by the next setup.
  async_dependency:
    status: exempt
    comment: >-
      There is no external dependency to be async: the integration speaks to the
      eModul API through its own client on Home Assistant's aiohttp session, and
      the manifest declares no requirements. The rule's own exception covers
      this -- it does not apply when an integration has no external dependency.
  inject_websession:
    status: done
    comment: >-
      The API client is handed the session it uses rather than making one:
      Tech.__init__ takes a ClientSession, and both places that build one pass in
      Home Assistant's shared session (async_get_clientsession, in __init__.py
      and in config_flow.py). Nothing in the integration constructs a session of
      its own.
  strict_typing:
    status: done
    comment: >-
      The component is fully annotated and passes mypy in strict mode: fifteen
      source files, no issues. The package carries a py.typed marker, [tool.mypy]
      in pyproject.toml targets it with strict = true, and a bare mypy is a gate
      in the CI workflow and in the devenv scripts. Config entries are typed with
      TechConfigEntry (ConfigEntry[TechCoordinator]) and that alias is used in
      every signature that takes an entry, which is this rule's runtime-data
      clause. Reaching it fixed conformance problems rather than only adding
      hints: the entity mixin derives from Entity and the entities parameterise
      CoordinatorEntity[TechCoordinator], the redundant state property became
      native_value and is_on (Home Assistant declares state final), and the flow
      schemas moved to probatio, which is what the platform types data_schema as.
